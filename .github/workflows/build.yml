name: Build Android APK

# mainブランチにpushされるたびに自動でビルドを実行する
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手動実行ボタンも使えるようにする

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 必要なシステムパッケージをインストール
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev automake

      - name: Java 17を有効化
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: pipバージョンの制約を設定
        run: |
          echo "pip<24.0" > $HOME/pip-constraints.txt
          echo "setuptools<70" >> $HOME/pip-constraints.txt
          echo "PIP_CONSTRAINT=$HOME/pip-constraints.txt" >> $GITHUB_ENV

      - name: Buildozerをインストール
        run: |
          pip3 install --user --upgrade 'pip<24.0' 'setuptools<70' wheel
          pip3 install --user buildozer cython==0.29.36

      - name: APKをビルド
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PATH:$HOME/.local/bin"

          NDK_DIR="$HOME/.buildozer/android/platform"
          NDK_ZIP="$NDK_DIR/android-ndk-r25b-linux.zip"

          mkdir -p "$NDK_DIR"

          # 前回の失敗で残った可能性のある、不完全なファイルを削除しておく
          rm -rf "$NDK_DIR/android-ndk-r25b"
          rm -f "$NDK_ZIP"

          curl --fail --location --retry 5 --retry-all-errors \
            --retry-delay 5 \
            --output "$NDK_ZIP" \
            "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"

          # 壊れたZIPのままbuildozerに渡して分かりにくいエラーになるのを防ぐ
          unzip -t "$NDK_ZIP" >/dev/null

          # yes(ライセンス確認への自動同意)がbuildozer終了時にBroken pipeで
          # 終了すると、pipefailの影響で成功していてもビルド失敗扱いになるため、
          # buildozer自体の終了コードだけを見るようにする
          set +e
          yes | buildozer android debug
          buildozer_status=${PIPESTATUS[1]}
          set -e

          exit "$buildozer_status"

      - name: ビルド結果(APK)をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: biketracker-apk
          path: bin/*.apk
